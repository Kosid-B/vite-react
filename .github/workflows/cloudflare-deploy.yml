name: Deploy to Cloudflare Workers (production)

# Production จริง = Cloudflare Worker (ceo-ai-thailand) ผูก custom domain ceoaithailand.org
# ก่อนหน้านี้ต้อง `npx wrangler deploy` เอง → ตอนนี้ auto-deploy เมื่อ merge เข้า main
# (deploy.yml → GitHub Pages = legacy · ไม่ใช่ host จริง)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 🔴 ด่านที่ขาดมาตลอด (LESSONS-LEDGER #36–37 · เจ้าของสั่งปิดช่อง 22 ส.ค. 2569)
      #    ก่อนหน้านี้ deploy รันแค่ `npm run build` ⇒ ของที่ lint ไม่ผ่านขึ้น production ได้ทันที
      #    ผลคือ CI แดงติดกัน 54 รอบ 3 วัน โดยไม่มีอาการอะไรให้สังเกต เพราะ deploy ยังเขียวตลอด
      #    ⇒ "CI ที่แดงไม่ได้กั้นอะไรเลย" · และ rules-of-hooks (บั๊กที่ทำแอปขาวตอนล็อกอิน)
      #      เป็นกฎของ eslint ตัวเดียว — tsc/vitest มองไม่เห็น
      #    ⚠️ ผลข้างเคียงที่ยอมรับแล้ว: lint แดง = deploy ไม่ออก แม้ตอนต้องแก้ของเสียด่วน
      #       ทางออกตอนฉุกเฉินคือแก้ lint ให้ผ่าน ไม่ใช่ลบขั้นนี้ทิ้ง
      - name: Lint (ด่านเดียวกับ ci.yml — ห้ามลบ)
        run: npm run lint

      - name: Build (tsc + vite)
        run: npm run build
        env:
          # ตั้งใน repo: Settings → Secrets and variables → Actions (ชุดเดียวกับ deploy.yml)
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # ── Amplitude (product analytics + session replay) ────────────────────
          # 🔴 บทเรียน 19 ส.ค. 2569: โค้ด Amplitude เขียนเสร็จ · เทสต์ผ่าน · connector ต่อแล้ว
          #    แต่ตัวแปรนี้ไม่เคยถูกส่งเข้า build → bundle บน production มี AMP_KEY=''
          #    → isAmplitudeEnabled=false → SDK ไม่เคยโหลด → Amplitude ได้ข้อมูล 0 event
          #    "เขียนถูก" ≠ "ทำงานจริง" — บังคับด้วย envContract.test.ts แล้ว
          # คีย์นี้เป็น public client key (เหมือน GA measurement id) ฝังในบันเดิลได้โดยดีไซน์
          VITE_AMPLITUDE_KEY: ${{ secrets.VITE_AMPLITUDE_KEY }}
          # อัตราสุ่มอัด session replay 0..1 (ว่าง = 1 = อัดทุกเซสชัน) — ตั้งที่ Variables ไม่ใช่ Secrets
          VITE_AMPLITUDE_REPLAY_SR: ${{ vars.VITE_AMPLITUDE_REPLAY_SR }}

      - name: Deploy Worker + assets to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          # ⚠️ ต้องตรงกับ devDependencies.wrangler ใน package.json เป๊ะ ๆ
          #    บังคับด้วยเทสต์ deployToolchain.test.ts — ถ้าไม่ตรง เทสต์ล้ม
          # ประวัติ: >= 3.91.0 เพื่ออ่าน wrangler.jsonc (JSONC) — เดิม 3.90.0 ล้ม "Missing entry-point"
          # 18 ส.ค. 2569: 3.114.0 → 4.123.0 เพราะ `assets.run_worker_first` แบบ array
          #   ต้องการ wrangler >= 4.20.0 · v3 ปฏิเสธด้วย "Expected ... to be of type boolean"
          #   (v3 ยัง warn ว่า observability.traces/persist เป็น "unexpected fields" = ตัดทิ้งด้วย)
          wranglerVersion: '4.123.0'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
