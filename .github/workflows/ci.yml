name: CI

# ตาข่ายกัน regression: build + test ต้องผ่านก่อน merge เข้า main
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # 🔴 ห้ามลบ — ledger #114 · 26 พ.ย. 2569
  # push สาขาฟีเจอร์ "ก่อน" เปิด PR = ไม่มี pull_request event ⇒ CI ไม่รันกับ head นั้นเลย
  # และ GitHub จะผูก run ของ head เก่าเข้า PR ใหม่ ⇒ หน้า PR ดูเหมือนมีด่านแล้ว ทั้งที่ยังไม่ได้ตรวจ
  # ⇒ ต้องมีทางสั่งรันเองโดยไม่ต้องใช้ท่าที่ห้าม (คอมมิตว่าง / ปิด-เปิด PR ใหม่)
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (tsc + vite)
        run: npm run build

      - name: Unit tests
        run: npm run test:run
