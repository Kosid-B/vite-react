# กติกา: ระบุ "ทุก" ฟังก์ชันไว้ที่นี่ ให้ไฟล์นี้เป็น source of truth เดียว (กัน config drift ตอน bulk deploy)
# ค่าที่ตั้งต้องตรงกับ comment header ในแต่ละ index.ts

