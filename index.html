    <!-- Google Analytics 4 — เลื่อนโหลด gtag/js (~80KB) ออกจากเส้นทางสำคัญ (requestIdleCallback)
         คำสั่ง gtag() บัฟเฟอร์ใน dataLayer ก่อน แล้วประมวลผลเมื่อ lib โหลดเสร็จ = ไม่เสียการวัดผล -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      // Cross-domain measurement: b-tctraining.com (เว็บบริษัท) ↔ ceoaithailand.org (แอป)

      // ⚠️ ต้องตั้งใน GA4 UI ด้วย: Admin → Data Streams → Configure tag settings → Configure your domains → add ทั้ง 2 โดเมน
      gtag('config', 'G-CHJ99RY1Q1', {
        linker: { domains: ['b-tctraining.com', 'ceoaithailand.org'] }
      });
      (function(){
        function loadGa(){ var s=document.createElement('script'); s.async=1; s.src='https://www.googletagmanager.com/gtag/js?id=G-CHJ99RY1Q1'; document.head.appendChild(s); }
        if ('requestIdleCallback' in window) requestIdleCallback(loadGa, { timeout: 4000 });
        else setTimeout(loadGa, 3000);
      })();
    </script>

        // เรียกได้จาก consent flow (ตอนผู้ใช้กด "ยอมรับทั้งหมด") — ยิง pv ทันที
        window.__lineTagPv = function(){ loadLine(); try { _lt('send', 'pv', ['afc2c605-4307-45cc-b400-35bba3844d21']); } catch (e) {} };
